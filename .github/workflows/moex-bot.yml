name: MOEX Trading Bot

on:
  schedule:
    # Запускать каждые 2 часа с 7:00 до 19:00 по МСК (4:00-16:00 UTC)
    - cron: '0 4,6,8,10,12,14,16 * * 1-5'  # Пн-Пт, каждый день в 4,6,8,10,12,14,16 UTC
  workflow_dispatch:  # Позволяет запускать вручную
  push:
    branches: [ main ]
    paths:
      - 'moex_main.py'
      - 'moex_4h.py'
      - 'tickers.txt'
      - '.github/workflows/moex-bot.yml'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Create .env file from secrets
      run: |
        cat > .env << EOF
        TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID=${{ secrets.CHAT_ID }}
        TINKOFF_API_TOKEN=${{ secrets.TINKOFF_API_TOKEN }}
        EOF
        
    - name: Run bot
      run: python moex_main.py
      
    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: error-logs
        path: ./
        if-no-files-found: ignore
