name: MOEX Trading Bot

on:
  schedule:
    - cron: '0 4,6,8,10,12,14,16,18,20 * * 1-5'
    - cron: '0 4,6,8,10,12,14,16 * * 6,0'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Moex_bot/**'
      - '.github/workflows/moex-bot.yml'

jobs:
  run-moex-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4  # Обновили
      
    - name: Debug structure
      run: |
        echo "📁 Структура репозитория:"
        ls -la
        echo "📁 Содержимое Moex_bot/:"
        ls -la Moex_bot/
      
    - name: Set up Python
      uses: actions/setup-python@v5  # Обновили
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Create .env file with secrets
      run: |
        echo "TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}" > .env
        echo "CHAT_ID=${{ secrets.CHAT_ID }}" >> .env
        echo "TINKOFF_API_TOKEN=${{ secrets.TINKOFF_API_TOKEN }}" >> .env
        echo "✅ Создан .env файл"
        
    - name: Run MOEX Bot
      run: |
        cd Moex_bot
        python moex_main.py
        
    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v4  # ⚠️ ИЗМЕНИТЕ НА v4!
      with:
        name: moex-error-logs-${{ github.run_id }}
        path: |
          Moex_bot/*.log
          Moex_bot/*.txt
        retention-days: 14
