name: MOEX Trading Bot

on:
  schedule:
    # Будние дни (пн-пт): с 7:00 до 23:00 МСК (каждые 2 часа)
    - cron: '0 4,6,8,10,12,14,16,18,20 * * 1-5'
    
    # Выходные (сб-вс): с 7:00 до 19:00 МСК (каждые 2 часа)
    - cron: '0 4,6,8,10,12,14,16 * * 6,0'
    
  workflow_dispatch:  # Позволяет запускать вручную
  push:
    branches: [ main ]
    paths:
      - '**.py'
      - 'tickers.txt'
      - '.github/workflows/*.yml'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Create .env file from secrets
      run: |
        echo "TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}" > .env
        echo "CHAT_ID=${{ secrets.CHAT_ID }}" >> .env
        echo "TINKOFF_API_TOKEN=${{ secrets.TINKOFF_API_TOKEN }}" >> .env
        
    - name: Run MOEX Trading Bot
      run: python moex_main.py
      
    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: error-logs-${{ github.run_id }}
        path: |
          ./*.log
          ./*.txt
        retention-days: 14
