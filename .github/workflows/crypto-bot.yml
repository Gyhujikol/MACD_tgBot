name: Crypto Trading Bot

on:
  schedule:
    # Крипта торгуется 24/7, каждые 2 часа
    - cron: '0 */2 * * *'
  workflow_dispatch:  # Ручной запуск
  push:
    branches: [ main ]
    paths:
      - 'Crypt_bot/**'
      - '.github/workflows/crypto-bot.yml'

jobs:
  run-crypto-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Debug structure
      run: |
        echo "📁 Структура репозитория:"
        ls -la
        echo "📁 Содержимое Crypt_bot/:"
        ls -la Crypt_bot/
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ccxt ta  # Специфичные для крипты
        
    - name: Create .env file with secrets
      run: |
        echo "TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}" > .env
        echo "CHAT_ID=${{ secrets.CHAT_ID }}" >> .env
        echo "✅ Создан .env файл"
        
    - name: Run Crypto Bot
      run: |
        cd Crypt_bot
        python crypto_main.py
        
    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: crypto-error-logs-${{ github.run_id }}
        path: |
          Crypt_bot/*.log
          Crypt_bot/*.txt
        retention-days: 14
