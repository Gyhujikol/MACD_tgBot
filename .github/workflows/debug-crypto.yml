name: 🔍 Debug Crypto Bot

on: workflow_dispatch

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
    - uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        echo "📦 Устанавливаю зависимости..."
        python -m pip install --upgrade pip
        pip install ccxt pandas ta python-telegram-bot python-dotenv
        echo "✅ Зависимости установлены"
        
    - name: Debug 1 - Проверка файлов
      run: |
        echo "📁 СТРУКТУРА ФАЙЛОВ:"
        pwd
        ls -la
        echo ""
        echo "📁 Crypt_bot/:"
        ls -la Crypt_bot/
        echo ""
        echo "📁 Содержимое Crypt_bot/tickers.txt:"
        cat Crypt_bot/tickers.txt || echo "❌ Файл не найден"
        
    - name: Debug 2 - Проверка Python и библиотек
      run: |
        echo "🐍 ВЕРСИИ БИБЛИОТЕК:"
        python --version
        python -c "import ccxt; print(f'ccxt: {ccxt.__version__}')"
        python -c "import pandas; print(f'pandas: {pandas.__version__}')"
        python -c "import ta; print(f'ta: {ta.__version__}')"
        
    - name: Debug 3 - Тест Binance API
      run: |
        echo "🔗 ТЕСТ BINANCE API:"
        python -c "
import ccxt
import sys

print('1. Создаем exchange объект...')
exchange = ccxt.binance({
    'timeout': 30000,
    'enableRateLimit': True,
    'options': {'defaultType': 'spot'}
})

print('2. Загружаем рынки...')
try:
    markets = exchange.load_markets()
    print(f'✅ Загружено {len(markets)} торговых пар')
    
    # Тестируем конкретные пары
    test_symbols = ['BTC/USDT', 'BTCUSDT', 'ETH/USDT', 'ETHUSDT']
    for sym in test_symbols:
        if sym in exchange.symbols:
            print(f'✅ Пара {sym} найдена в exchange.symbols')
        else:
            print(f'❌ Пара {sym} НЕ найдена в exchange.symbols')
    
    print('\\n3. Ищем все USDT пары:')
    usdt_pairs = [s for s in exchange.symbols if 'USDT' in s][:5]
    print(f'Первые 5 USDT пар: {usdt_pairs}')
    
except Exception as e:
    print(f'❌ Ошибка: {type(e).__name__}: {e}')
    import traceback
    traceback.print_exc()
        "
        
    - name: Debug 4 - Тест получения свечей
      run: |
        echo "📊 ТЕСТ ПОЛУЧЕНИЯ СВЕЧЕЙ:"
        python -c "
import ccxt
import pandas as pd

print('1. Подключаемся к Binance...')
exchange = ccxt.binance({
    'timeout': 30000,
    'enableRateLimit': True,
})

print('2. Пробуем получить свечи для BTC/USDT...')
try:
    # Пробуем разные форматы
    symbols_to_try = ['BTC/USDT', 'BTCUSDT', 'BTCUSDT'.lower()]
    
    for symbol in symbols_to_try:
        print(f'\\n🔍 Пробуем символ: {symbol}')
        try:
            ohlcv = exchange.fetch_ohlcv(symbol, '4h', limit=10)
            print(f'✅ Получено свечей: {len(ohlcv)}')
            if ohlcv:
                print(f'   Первая свеча: {ohlcv[0]}')
                print(f'   Последняя свеча: {ohlcv[-1]}')
            break
        except ccxt.BadSymbol as e:
            print(f'❌ BadSymbol: {e}')
            continue
        except Exception as e:
            print(f'⚠️ Ошибка: {type(e).__name__}: {e}')
            continue
            
    if not ohlcv:
        print('\\n3. Пробуем получить список всех символов...')
        markets = exchange.load_markets()
        btc_symbols = [s for s in markets.keys() if 'BTC' in s and 'USDT' in s][:3]
        print(f'Найдены BTC пары: {btc_symbols}')
        
        for sym in btc_symbols:
            try:
                ohlcv = exchange.fetch_ohlcv(sym, '4h', limit=5)
                print(f'✅ {sym}: {len(ohlcv)} свечей')
                break
            except Exception as e:
                print(f'❌ {sym}: {e}')
                
except Exception as e:
    print(f'💥 Критическая ошибка: {type(e).__name__}: {e}')
    import traceback
    traceback.print_exc()
        "
        
    - name: Debug 5 - Тест полного скрипта
      run: |
        echo "🚀 ТЕСТ ПОЛНОГО СКРИПТА:"
        cd Crypt_bot
        python -c "
import sys
import os

print('1. Проверка путей...')
print(f'Текущая директория: {os.getcwd()}')
print(f'Файлы в директории: {os.listdir(\".\")}')

print('\\n2. Тест импортов...')
try:
    from crypto_fetcher import CryptoFetcher
    print('✅ crypto_fetcher импортирован')
    
    print('\\n3. Тест загрузки тикеров...')
    tickers = []
    try:
        with open('tickers.txt', 'r', encoding='utf-8') as f:
            for line in f:
                line = line.strip()
                if line and not line.startswith('#'):
                    tickers.append(line)
        print(f'✅ Загружено тикеров: {len(tickers)}')
        print(f'Тикеры: {tickers}')
    except Exception as e:
        print(f'❌ Ошибка загрузки tickers.txt: {e}')
    
    if tickers:
        print('\\n4. Тест получения данных для первого тикера...')
        fetcher = CryptoFetcher()
        data = fetcher.get_4h_data(tickers[0], days=30)
        if data:
            print(f'✅ Данные получены!')
            print(f'   Цена: {data[\"current_price\"]}')
            print(f'   Сигнал: {data[\"signal\"]}')
        else:
            print(f'❌ Данные не получены')
            
except ImportError as e:
    print(f'❌ Ошибка импорта: {e}')
    import traceback
    traceback.print_exc()
except Exception as e:
    print(f'💥 Общая ошибка: {e}')
    import traceback
    traceback.print_exc()
        "
